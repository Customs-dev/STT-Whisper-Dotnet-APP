name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test SttApp.Tests/SttApp.Tests.csproj `
            -c Release `
            --nologo `
            --logger "console;verbosity=normal"

      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish SttApp.csproj -c Release -r win-x64 --self-contained true -o bin/publish

      - name: Create models placeholder
        shell: pwsh
        run: |
          $dir = "bin/publish/models"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir | Out-Null }
          "" | Set-Content "$dir/.gitkeep"

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Pack with Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId Prompto `
            --packVersion ${{ steps.version.outputs.VERSION }} `
            --packDir bin/publish `
            --mainExe Prompto.exe `
            --outputDir velopack-out `
            --icon prompto.ico `
            --exclude "models\*"

      - name: Delete existing draft release (if any)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Headers $headers
          $existing = $releases | Where-Object { $_.tag_name -eq "${{ github.ref_name }}" -and $_.draft -eq $true }
          if ($existing) {
            Write-Host "Deleting existing draft release $($existing.id) for tag ${{ github.ref_name }}"
            Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($existing.id)" -Headers $headers
          } else {
            Write-Host "No existing draft release found for tag ${{ github.ref_name }}"
          }

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --tag "${{ github.ref_name }}" `
            --outputDir velopack-out `
            --token $env:GITHUB_TOKEN `
            --publish
